# Used Sonnet 5 with Medium Effort, for generating a GitHub Actions workflow that syncs this repo to a Hugging Face Space and sends a Discord notification on completion.
# prompt: Write a GitHub Actions workflow that triggers on push to main and on workflow_dispatch, checks out the repo with full git history and LFS enabled, then force pushes the current main branch to a Hugging Face Space remote using HF_USERNAME, HF_TOKEN and HF_SPACE repository secrets. After that step, add a step that always runs, even if the push step fails, which sends a POST request to a Discord webhook URL stored in the DISCORD_WEBHOOK secret reporting the job status, the commit SHA and the GitHub actor who triggered the run.
name: Sync to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote add hf https://${{ secrets.HF_USERNAME }}:$HF_TOKEN@huggingface.co/spaces/${{ secrets.HF_USERNAME }}/${{ secrets.HF_SPACE }}
          git push --force hf main
      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          STATUS="${{ job.status }}"
          curl -H "Content-Type: application/json" -X POST \
            -d "{\"content\": \"GitHub Action **$STATUS** for commit \`${{ github.sha }}\` by ${{ github.actor }}\"}" \
            "$DISCORD_WEBHOOK"
